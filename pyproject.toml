[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sil-mac"
version = "2.0.0"
description = "Next-Gen macOS Deep Optimizer, AI Model Hunter & Developer Powerhouse (Mole Alternative)"
readme = "README.md"
authors = [
  { name = "Uğur Yaşayan", email = "yasayanugur@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "rich>=13.0.0",
  "psutil>=5.9.0",
  "InquirerPy>=0.3.4",
  "wcwidth>=0.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
keywords = [
  "macos", "apple-silicon", "optimizer", "cleanup", "developer-tools",
  "ai-models", "ollama", "huggingface", "mlx", "tui", "cli"
]
classifiers = [
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities"
]

[project.scripts]
sil = "nexus.main:main"
nexus = "nexus.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
